<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RPGSkills</title>
    <script>
      // GitHub Pages project site: redirect unknown paths to app entry (HashRouter)
      const segment = '/rpgskills-site';
      const path = location.pathname.startsWith(segment)
        ? location.pathname.slice(segment.length) || '/'
        : location.pathname;
      const target = segment + '/#' + path + location.search + location.hash;
      location.replace(target);
    </script>
  </head>
  <body></body>
</html>
