<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RPGSkills">
  <defs>
    <linearGradient id="shield" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="glow" x1="20" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ecf8e"/>
      <stop offset="1" stop-color="#2a9d6a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3ecf8e" flood-opacity="0.35"/>
    </filter>
