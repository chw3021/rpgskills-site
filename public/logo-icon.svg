    <rect x="26" y="34" width="12" height="3" rx="0.5"/>
    <rect x="28" y="37" width="8" height="2" rx="0.5"/>
    <rect x="31" y="10" width="2" height="5" rx="0.5"/>
  </g>
  <!-- Gem (RPG loot) -->
  <path fill="#3ecf8e" opacity="0.9" d="m32 22 4 4-4 4-4-4 4-4Z"/>
  <path fill="#e8eef4" opacity="0.5" d="m32 23.5 1.5 1.5-1.5 1.5-1.5-1.5 1.5-1.5Z"/>
